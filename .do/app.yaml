name: blood-pressure
region: nyc

static_sites:
  - name: web
    github:
      branch: main
      deploy_on_push: false  # controlled by GitHub Actions
      repo: GITHUB_USERNAME/blood-pressure
    build_command: pnpm install --frozen-lockfile && pnpm generate
    output_dir: .output/public
    environment_slug: node-22
    routes:
      - path: /
    catchall_document: index.html
    envs:
      - key: NUXT_TELEMETRY_DISABLED
        value: "1"
